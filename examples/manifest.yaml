tasks:
  - prompt: Create result-a.txt containing A and verify it.
    workspace: C:\path\to\fixture-a
    modelProfile: &model
      baseUrl: https://api.deepseek.com/v1
      model: deepseek-chat
      protocol: chat-completions
      contextBudget: 120000
    permissionMode: workspace-write
    network: true
    grader: ["if (!(Test-Path result-a.txt)) { throw 'missing result-a.txt' }"]
    variant: dsh-minimal-a
  - prompt: Create result-b.txt containing B and verify it.
    workspace: C:\path\to\fixture-b
    modelProfile:
      <<: *model
    permissionMode: workspace-write
    network: true
    grader: ["if (!(Test-Path result-b.txt)) { throw 'missing result-b.txt' }"]
    variant: dsh-minimal-b
